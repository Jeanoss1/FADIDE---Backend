spring.application.name=sisco-backend
server.port=8080

# Parametros de conexion unificados
spring.datasource.url=jdbc:postgresql://localhost:5432/sisco_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

sisco.jwt.secret=${JWT_SECRET:dev-secret-key-sisco-backend-cambiar-en-produccion-32+}
sisco.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
sisco.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}
# Client ID de Google Cloud (OAuth, Aplicación web) - reemplazar por el real
sisco.google.client-id=${GOOGLE_CLIENT_ID:TU_CLIENT_ID.apps.googleusercontent.com}
sisco.admin.correo=${ADMIN_CORREO:admin@fadide.com}
sisco.admin.password=${ADMIN_PASSWORD:Admin123.}