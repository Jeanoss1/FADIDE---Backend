spring.application.name=sisco-backend
server.port=8080

# Parametros de conexion. En el servidor (Tomcat) se definen como variables de entorno en
# bin/setenv.sh; los valores despues de ':' solo aplican al desarrollo local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sisco_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

sisco.jwt.secret=${JWT_SECRET:dev-secret-key-sisco-backend-cambiar-en-produccion-32+}
sisco.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
sisco.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}
# Client ID de Google Cloud (OAuth, Aplicación web)
sisco.google.client-id=${GOOGLE_CLIENT_ID:101214051365-lblrf36bkjqnfu7nsc3r99sou4fbv6lf.apps.googleusercontent.com}
sisco.admin.correo=${ADMIN_CORREO:admin@fadide.com}
sisco.admin.password=${ADMIN_PASSWORD:Admin123.}
# Evidencias con archivo adjunto (imágenes, PDF, Word, Excel...): máximo 10 MB por archivo.
# La carpeta queda fuera del WAR; en Docker es el volumen sisco-evidencias.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
sisco.evidencias.directorio=${EVIDENCIAS_DIR:${user.home}/sisco-evidencias}
