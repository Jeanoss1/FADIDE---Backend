# Apache HTTP Server (VM-Frontend, AlmaLinux 9) — /etc/httpd/conf.d/sisco.conf
# Publica el build de producción de Angular copiado en /var/www/html y permite que el
# .htaccess incluido en el build redirija las rutas internas a index.html.

<VirtualHost *:80>
    ServerName 192.168.56.30
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Los archivos con hash (main-XXXX.js, styles-XXXX.css) pueden guardarse en caché
    <FilesMatch "\.(js|css|png|jpg|svg|ico|woff2?)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>
    # index.html siempre se pide de nuevo, para que tome el último build
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    ErrorLog /var/log/httpd/sisco_error.log
    CustomLog /var/log/httpd/sisco_access.log combined
</VirtualHost>
