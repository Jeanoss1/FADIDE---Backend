# Apache HTTP Server (contenedor sisco-frontend, AlmaLinux 9) — /etc/httpd/conf.d/sisco.conf
# Publica el build de producción de Angular en /var/www/html y permite que el .htaccess
# incluido en el build redirija las rutas internas de Angular a index.html.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Archivos con hash (main-XXXX.js, styles-XXXX.css): se pueden guardar en caché
    <FilesMatch "\.(js|css|png|jpg|svg|ico|woff2?)$">
        Header set Cache-Control "public, max-age=604800"
    </FilesMatch>
    # index.html siempre se pide de nuevo, para tomar el último build
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    # En el contenedor los registros van a la salida estándar (docker logs sisco-frontend)
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
